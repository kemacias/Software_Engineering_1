<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slice Lab Ordering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one focused column; workflow tracker on top mirrors the UML activity diagram; sticky cart bar at the bottom of the menu */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --sunk:#e9ede6; --fg:#1b221e; --muted:#5a655f; --line:#d8ded6;
  --accent:#cf3a1d; --accent-ink:#ffffff; --accent-soft:#fbe4dd;
  --basil:#2c7447; --basil-soft:#dcefe2; --cheese:#e9a919; --cheese-soft:#fbefcf; --danger:#b3261e; --danger-soft:#fbe1df;
  --f-display:"Bagel Fat One", "Arial Black", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121614; --surface:#1b201d; --sunk:#232925; --fg:#ebefe9; --muted:#9ba69f; --line:#2e3631;
  --accent:#ff6845; --accent-ink:#1a0d08; --accent-soft:#3a1d15;
  --basil:#66c48a; --basil-soft:#1b3324; --cheese:#f2c04e; --cheese-soft:#3a2f12; --danger:#ff8a80; --danger-soft:#3b1a18; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1b201d; --sunk:#232925; --fg:#ebefe9; --muted:#9ba69f; --line:#2e3631;
  --accent:#ff6845; --accent-ink:#1a0d08; --accent-soft:#3a1d15;
  --basil:#66c48a; --basil-soft:#1b3324; --cheese:#f2c04e; --cheese-soft:#3a2f12; --danger:#ff8a80; --danger-soft:#3b1a18; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 32px}
.shell{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,6vw,3rem);letter-spacing:.01em}
h2{font-size:1.4rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.9em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 4px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:1.7rem;color:var(--accent);line-height:1}
.tag{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.who{display:flex;gap:10px;align-items:center;font-size:.9rem;flex-wrap:wrap}
.flow ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.flow li{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:5px 10px 5px 6px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.flow li .n{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface);font-family:var(--f-mono);font-size:.72rem}
.flow li.done{background:var(--basil-soft);color:var(--basil)}
.flow li.done .n{background:var(--basil);color:var(--surface)}
.flow li.cur{background:var(--accent);color:var(--accent-ink)}
.flow li.cur .n{background:var(--accent-ink);color:var(--accent)}
.flow-cap{font-size:.78rem;color:var(--muted);margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.small{min-height:34px;padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,.choice:focus-within,.seg button:focus-visible{outline:3px solid var(--cheese);outline-offset:2px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center}
.hero-art{aspect-ratio:1;max-width:100%;width:100%}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero-art{max-width:220px;justify-self:center}}
form.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px 12px}
.field{display:flex;flex-direction:column;gap:5px;grid-column:span 6;min-width:0}
.field.c3{grid-column:span 3}.field.c2{grid-column:span 2}.field.c4{grid-column:span 4}
@media (max-width:560px){.field.c3,.field.c2,.field.c4{grid-column:span 6}}
label{font-size:.85rem;font-weight:600}
.opt{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=tel],select{font:inherit;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;min-height:44px}
input[aria-invalid=true]{border-color:var(--danger)}
.err{color:var(--danger);font-size:.82rem}
.section-label{grid-column:span 6;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.banner{border-radius:10px;padding:12px 14px;font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.banner.ok{background:var(--basil-soft);color:var(--basil)}
.banner.info{background:var(--cheese-soft);color:var(--fg)}
.banner.bad{background:var(--danger-soft);color:var(--danger)}
.cat{display:flex;flex-direction:column;gap:12px}
.cat-h{display:flex;align-items:baseline;gap:10px}
.cat-h h2{font-family:var(--f-display);font-weight:400;font-size:1.5rem}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item .price{font-family:var(--f-mono);font-size:.95rem}
.item p{color:var(--muted);font-size:.9rem;flex:1}
.item .row{margin-top:4px}
.cartbar{position:sticky;bottom:12px;z-index:5;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 10px 10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:0 8px 24px rgb(0 0 0 / .18)}
.cartbar .btn.primary{border-color:var(--accent)}
.lines{display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:14px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .d{color:var(--muted);font-size:.88rem;min-width:0}
.line .p{font-family:var(--f-mono);text-align:right}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{font:inherit;width:34px;height:34px;border:0;background:var(--sunk);color:var(--fg);cursor:pointer}
.qty span{min-width:34px;text-align:center;font-family:var(--f-mono)}
.totals{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-variant-numeric:tabular-nums}
.totals .v{font-family:var(--f-mono);text-align:right}
.totals .grand{font-weight:700;font-size:1.1rem;border-top:1px solid var(--line);padding-top:8px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.choice{position:relative;border:2px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice b{font-size:1.05rem}
.choice small{color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative}
.pill input{position:absolute;opacity:0}
.pill span{display:block;padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:.9rem;cursor:pointer;background:var(--surface)}
.pill input:checked+span{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill input:focus-visible+span{outline:3px solid var(--cheese);outline-offset:2px}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
@media (max-width:720px){.split{grid-template-columns:1fr}}
.split>*{min-width:0}
/* modal */
.scrim{position:fixed;inset:0;background:rgb(10 14 12 / .55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
@media (min-width:640px){.scrim{align-items:center}}
.modal{background:var(--surface);color:var(--fg);border-radius:16px;width:100%;max-width:620px;max-height:calc(100% - 16px);overflow:auto;display:flex;flex-direction:column}
.modal-h{padding:20px 20px 6px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal-b{padding:8px 20px 16px;display:flex;flex-direction:column;gap:18px}
.modal-f{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tops{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;min-width:0}
.top-row .nm{font-size:.92rem;font-weight:600;min-width:0}
.top-row .nm small{display:block;font-weight:500;color:var(--basil);font-size:.75rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}
.seg button{font:inherit;font-size:.78rem;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 9px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.seg button[data-l="2"][aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.group-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.group-h small{color:var(--muted)}
/* tracker */
.track{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.track li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;position:relative;padding-bottom:20px}
.track li:last-child{padding-bottom:0}
.track li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.track li:last-child::before{display:none}
.track li.done::before{background:var(--basil)}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:.8rem;color:var(--surface)}
.track li.done .dot{background:var(--basil);border-color:var(--basil)}
.track li.cur .dot{border-color:var(--accent);background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.track li .t{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.track li.todo .lbl{color:var(--muted)}
.track .lbl b{display:block}
.track .lbl small{color:var(--muted)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}50%{box-shadow:0 0 0 7px var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){.track li.cur .dot{animation:none}}
.ordno{font-family:var(--f-mono);font-size:1.3rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
.empty{text-align:center;padding:30px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.foot{font-size:.8rem;color:var(--muted);text-align:center}
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <div class="brand"><span class="logo">Slice Lab</span><span class="tag">Online ordering · prototype</span></div>
    <div class="who" id="who"></div>
  </header>
  <nav class="flow" aria-label="Workflow progress"><ol id="flow"></ol><p class="flow-cap" id="flowcap"></p></nav>
  <main id="app"></main>
  <p class="foot">Prototype for a UML activity diagram walkthrough. Accounts, orders and payments are simulated in this page only; nothing is sent or charged.</p>
</div>
<div id="modal-root"></div>

<script>
const STEPS=['Account','Menu','Customize','Cart','Pickup or delivery','Payment','Order status'];
const SCREEN_STEP={welcome:0,signup:0,login:0,menu:1,cart:3,fulfill:4,pay:5,status:6};
const TOPS=[
 {id:'pepperoni',name:'Pepperoni'},{id:'sausage',name:'Italian sausage'},{id:'bacon',name:'Bacon'},{id:'chicken',name:'Grilled chicken'},
 {id:'mushrooms',name:'Mushrooms'},{id:'peppers',name:'Green peppers'},{id:'onions',name:'Red onions'},{id:'olives',name:'Black olives'},
 {id:'jalapenos',name:'Jalapeños'},{id:'pineapple',name:'Pineapple'},{id:'basil',name:'Fresh basil'},{id:'xcheese',name:'Extra mozzarella'}];
const SIZES=[{id:'S',label:'Small',inch:10,d:-2},{id:'M',label:'Medium',inch:12,d:0},{id:'L',label:'Large',inch:14,d:3},{id:'XL',label:'X-Large',inch:16,d:5}];
const CRUSTS=[{id:'hand',label:'Hand-tossed',d:0},{id:'thin',label:'Thin & crispy',d:0},{id:'deep',label:'Deep dish',d:2},{id:'gf',label:'Gluten-free',d:3}];
const MENU=[
 {id:'byo',cat:'Pizzas',name:'Build Your Own',desc:'Red sauce and mozzarella. Add whatever you like.',price:11,pizza:true,preset:[]},
 {id:'marg',cat:'Pizzas',name:'Margherita',desc:'Crushed tomato, fresh mozzarella, basil, olive oil.',price:12,pizza:true,preset:['basil']},
 {id:'pep',cat:'Pizzas',name:'Classic Pepperoni',desc:'Cup-and-char pepperoni over a mozzarella blend.',price:14,pizza:true,preset:['pepperoni']},
 {id:'veg',cat:'Pizzas',name:'Veggie Garden',desc:'Mushrooms, green peppers, red onions, black olives.',price:13,pizza:true,preset:['mushrooms','peppers','onions','olives']},
 {id:'bbq',cat:'Pizzas',name:'BBQ Chicken',desc:'Smoky BBQ base, grilled chicken, red onions.',price:15,pizza:true,preset:['chicken','onions']},
 {id:'knots',cat:'Sides',name:'Garlic Knots',desc:'Six knots with garlic butter and marinara.',price:6,preset:[]},
 {id:'caesar',cat:'Sides',name:'Caesar Salad',desc:'Romaine, parmesan, croutons, house dressing.',price:7,preset:[]},
 {id:'cinna',cat:'Sides',name:'Cinnamon Bites',desc:'Sugared dough bites with icing for dipping.',price:5,preset:[]},
 {id:'soda',cat:'Drinks',name:'Lemon Soda',desc:'12 oz can.',price:2.5,preset:[]},
 {id:'water',cat:'Drinks',name:'Sparkling Water',desc:'16 oz bottle.',price:2,preset:[]},
 {id:'rootbeer',cat:'Drinks',name:'Root Beer',desc:'12 oz can.',price:2.5,preset:[]}];
const STORES=[{id:'west',name:'Westside',addr:'410 Larch Ave'},{id:'down',name:'Downtown',addr:'88 Mill St'},{id:'east',name:'Eastgate',addr:'2315 Ridge Rd'}];
const DELIVERY_FEE=3.99;
const STAGES={pickup:[['Order received','We have your order.'],['Preparing','Dough is stretched and topped.'],['In the oven','Baking at 700°F.'],['Ready for pickup','Head to the counter.'],['Picked up','Enjoy!']],
 delivery:[['Order received','We have your order.'],['Preparing','Dough is stretched and topped.'],['In the oven','Baking at 700°F.'],['Out for delivery','Your driver is on the way.'],['Delivered','Enjoy!']]};
const EXAMPLE={name:'Captain Riz',email:'captain.riz@example.com',password:'pepperoni8',phone:'555-0142',street:'12 Harbor Way',apt:'',city:'Springfield',state:'IL',zip:'62701'};

const S={screen:'welcome',accounts:[{name:'Demo Customer',email:'demo@slicelab.test',password:'pizza1234',phone:'',address:{street:'500 Sample St',apt:'',city:'Springfield',state:'IL',zip:'62704'}}],
 user:null,cart:[],fulfill:{mode:null,store:'west',time:'asap',useSaved:true,alt:{}},order:null,draft:{},errors:{},notice:null,custom:null,paying:false,checkMsg:null};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+n.toFixed(2);
const byId=id=>MENU.find(m=>m.id===id);
const clock=d=>d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const clockS=d=>d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'});

function unitPrice(c){
  const it=byId(c.itemId); if(!it.pizza) return it.price;
  let p=it.price+SIZES.find(s=>s.id===c.size).d+CRUSTS.find(x=>x.id===c.crust).d;
  for(const t of TOPS){const lv=c.tops[t.id]||0, inc=it.preset.includes(t.id); if(lv>=1&&!inc)p+=1.5; if(lv===2)p+=1.5;}
  return p;
}
function describe(l){
  const it=byId(l.itemId); if(!it.pizza) return '';
  const sz=SIZES.find(s=>s.id===l.size), cr=CRUSTS.find(c=>c.id===l.crust);
  const mods=[];
  for(const t of TOPS){const lv=l.tops[t.id]||0, inc=it.preset.includes(t.id);
    if(lv===2) mods.push('Extra '+t.name.toLowerCase()); else if(lv===1&&!inc) mods.push('+ '+t.name); else if(lv===0&&inc) mods.push('No '+t.name.toLowerCase());}
  return `${sz.label} ${sz.inch}″ · ${cr.label}${mods.length?' · '+mods.join(', '):''}`;
}
const subtotal=()=>S.cart.reduce((a,l)=>a+l.unit*l.qty,0);
const count=()=>S.cart.reduce((a,l)=>a+l.qty,0);
const fee=()=>S.fulfill.mode==='delivery'?DELIVERY_FEE:0;

function field(form,name,label,o={}){
  const v=(S.draft[form]||{})[name]??''; const e=S.errors[name]; const id=form+'-'+name;
  return `<div class="field ${o.cls||''}"><label for="${id}">${label}${o.optional?' <span class="opt">optional</span>':''}</label>
  <input id="${id}" name="${name}" type="${o.type||'text'}" value="${esc(v)}" ${o.attrs||''} aria-invalid="${!!e}">${e?`<p class="err">${esc(e)}</p>`:''}</div>`;
}
function notice(){ if(!S.notice) return ''; const n=S.notice; return `<div class="banner ${n.kind}" role="status">${n.text}</div>`; }

/* ---------- views ---------- */
const V={
welcome(){return `<section class="card hero">
  <div class="stack">
    <h1>Hot pizza, built your way.</h1>
    <p class="muted">Create an account, build a pizza with any toppings, choose pickup or delivery, and follow your order until it's ready.</p>
    <div class="row"><button class="btn primary" data-act="go" data-to="signup">Create an account</button><button class="btn" data-act="go" data-to="login">I already have an account</button></div>
    <p class="muted" style="font-size:.88rem">First time ordering? You need an account so we can send your confirmation and track your order.</p>
  </div>
  <svg class="hero-art" viewBox="0 0 200 200" role="img" aria-label="Pizza illustration">
    <circle cx="100" cy="100" r="92" fill="var(--cheese)"/><circle cx="100" cy="100" r="78" fill="var(--cheese-soft)"/>
    <circle cx="100" cy="100" r="74" fill="var(--cheese)" opacity=".55"/>
    ${[[70,72],[128,66],[100,108],[66,128],[136,124],[104,150],[92,40]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="12" fill="var(--accent)"/>`).join('')}
    ${[[118,92],[82,96],[120,148],[58,100]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="7" ry="4" fill="var(--basil)" transform="rotate(30 ${x} ${y})"/>`).join('')}
    <path d="M100 100 L100 8 A92 92 0 0 1 179.7 54 Z" fill="var(--bg)" opacity=".9"/>
  </svg></section>`;},

signup(){return `<section class="card stack">
  <div class="row between"><div><h2>Create your account</h2><p class="muted">We use your address for delivery and your email for order updates.</p></div>
  <button class="btn small" data-act="example">Fill example details</button></div>
  ${notice()}
  <form class="grid" data-form="signup" novalidate>
    ${field('signup','name','Full name',{cls:'c3',attrs:'autocomplete="name"'})}
    ${field('signup','phone','Phone',{cls:'c3',type:'tel',optional:true,attrs:'autocomplete="tel"'})}
    ${field('signup','email','Email',{cls:'c3',type:'email',attrs:'autocomplete="email"'})}
    ${field('signup','password','Password',{cls:'c3',type:'password',attrs:'autocomplete="new-password" placeholder="At least 8 characters"'})}
    <p class="section-label">Delivery address</p>
    ${field('signup','street','Street address',{cls:'c4',attrs:'autocomplete="address-line1"'})}
    ${field('signup','apt','Apt / suite',{cls:'c2',optional:true,attrs:'autocomplete="address-line2"'})}
    ${field('signup','city','City',{cls:'c3',attrs:'autocomplete="address-level2"'})}

/* ---------- helpers ---------- */
function timeSlots(){const out=[{v:'asap',l:'As soon as possible (~20 min)'}]; const d=new Date(Date.now()+30*60000); d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0);
  for(let i=0;i<5;i++){const t=new Date(d.getTime()+i*15*60000); out.push({v:String(t.getTime()),l:clock(t)});} return out;}
function storeLabel(){const s=STORES.find(x=>x.id===S.fulfill.store); return s.name+', '+s.addr;}
function timeLabel(){return S.fulfill.time==='asap'?'As soon as possible':clock(new Date(+S.fulfill.time));}
function deliveryAddr(){return S.fulfill.useSaved?S.user.address:S.fulfill.alt;}
function addrLabel(a){return `${a.street}${a.apt?', '+a.apt:''}, ${a.city}, ${a.state} ${a.zip}`;}
function validAddr(d,errs){
  if(!d.street?.trim())errs.street='Enter a street address.';
  if(!d.city?.trim())errs.city='Enter a city.';
  if(!/^[A-Za-z]{2}$/.test(d.state||''))errs.state='Use 2 letters.';
  if(!/^\d{5}$/.test(d.zip||''))errs.zip='Enter a 5-digit ZIP code.';
}
function luhn(n){let s=0,alt=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(alt){d*=2;if(d>9)d-=9}s+=d;alt=!alt}return s%10===0;}

/* ---------- render ---------- */
function render(){
  const step=SCREEN_STEP[S.screen]; const complete=S.screen==='status'&&S.order&&S.order.stage>=4;
  $('#flow').innerHTML=STEPS.map((s,i)=>{const c=(complete||i<step||(S.custom&&i<2))?'done':(S.custom?i===2:i===step)?'cur':'';return `<li class="${c}" ${c==='cur'?'aria-current="step"':''}><span class="n">${complete||i<step?'✓':i+1}</span>${s}</li>`}).join('');
  $('#flowcap').textContent=`Diagram step: ${S.custom?'Customize pizza':STEPS[step]}`;
  $('#who').innerHTML=S.user?`<span>Signed in as <b>${esc(S.user.name)}</b></span>${S.screen!=='status'||S.order?.stage>=4?`<button class="btn small" data-act="logout">Log out</button>`:''}${S.screen!=='menu'&&S.screen!=='status'&&count()?'':''}`:'';
  $('#app').innerHTML=V[S.screen]();
  renderModal();
}
/* ---------- router (hash-based SPA routing) ---------- */
const PUBLIC=['welcome','signup','login'];
function guard(to){
  if(!V[to]) to='welcome';
  if(!S.user && !PUBLIC.includes(to)) return 'login';
  if(S.user && PUBLIC.includes(to)) return S.order?'status':'menu';
  if(to==='status' && !S.order) return 'menu';
  if((to==='fulfill'||to==='pay') && !S.cart.length) return S.order?'status':'cart';
  if(to==='pay' && !S.fulfill.mode) return 'fulfill';
  return to;
}
function go(to,push=true){
  to=guard(to);
  S.screen=to;S.errors={};S.notice=null;S.checkMsg=null;S.custom=null;
  if(S.order)S.order.fresh=(to==='status'&&S.order.fresh);
  const h='#/'+to;
  if(location.hash!==h){ push?history.pushState(null,'',h):history.replaceState(null,'',h); }
  render();window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('popstate',()=>go(location.hash.replace(/^#\/?/,'')||'welcome',false));

/* ---------- customize modal ---------- */
function openCustomize(id){const it=byId(id); const tops={}; it.preset.forEach(t=>tops[t]=1); S.custom={itemId:id,size:'M',crust:'hand',tops,qty:1}; render(); setTimeout(()=>$('#modal-close')?.focus(),0);}
function renderModal(){

  const it=byId(c.itemId);
  root.innerHTML=`<div class="scrim" data-act="closebg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
   <div class="modal-h"><div><h2 id="mtitle">${it.name}</h2><p class="muted">${it.desc}</p></div><button class="btn small" id="modal-close" data-act="close" aria-label="Close">Close</button></div>
   <div class="modal-b">
    <div><div class="group-h"><h3>Size</h3></div><div class="pills">${SIZES.map(s=>`<label class="pill"><input type="radio" name="size" value="${s.id}" data-c="size" ${c.size===s.id?'checked':''}><span>${s.label} ${s.inch}″ · ${money(it.price+s.d)}</span></label>`).join('')}</div></div>
    <div><div class="group-h"><h3>Crust</h3></div><div class="pills">${CRUSTS.map(x=>`<label class="pill"><input type="radio" name="crust" value="${x.id}" data-c="crust" ${c.crust===x.id?'checked':''}><span>${x.label}${x.d?' +'+money(x.d):''}</span></label>`).join('')}</div></div>
    <div><div class="group-h"><h3>Toppings</h3><small>+$1.50 each · Extra adds $1.50</small></div>
     <div class="tops">${TOPS.map(t=>{const lv=c.tops[t.id]||0, inc=it.preset.includes(t.id);
      return `<div class="top-row"><span class="nm">${t.name}${inc?'<small>Included</small>':''}</span><span class="seg" role="group" aria-label="${t.name} amount">
       ${['None','Regular','Extra'].map((n,l)=>`<button type="button" data-act="top" data-t="${t.id}" data-l="${l}" aria-pressed="${lv===l}">${n}</button>`).join('')}</span></div>`}).join('')}</div></div>

   <div class="modal-f"><span class="qty"><button aria-label="Decrease quantity" data-act="cqty" data-d="-1">−</button><span id="cq">${c.qty}</span><button aria-label="Increase quantity" data-act="cqty" data-d="1">+</button></span>
    <button class="btn primary" data-act="addpizza" id="addbtn">Add to cart · ${money(unitPrice(c)*c.qty)}</button></div>
  </div></div>`;
}
function refreshPrice(){const b=$('#addbtn'); if(b)b.textContent='Add to cart · '+money(unitPrice(S.custom)*S.custom.qty); const q=$('#cq'); if(q)q.textContent=S.custom.qty;}

/* ---------- order status simulation ---------- */
let ticker=null;
function startTicker(){clearInterval(ticker); ticker=setInterval(()=>{const o=S.order; if(!o)return; const max=o.mode==='pickup'?3:4;
  if(o.stage<max){advance(); if(S.screen==='status'&&!S.custom)render();}},8000);}
function advance(){const o=S.order; if(o.stage>=4)return; o.stage++; o.stamps[o.stage]=new Date(); o.fresh=false;}

/* ---------- actions ---------- */
const A={
 go:d=>{ if(d.to==='fulfill'&&!S.cart.length)return; go(d.to); },
 example:()=>{S.draft.signup={...EXAMPLE};S.errors={};render();},
 customize:d=>openCustomize(d.id),
 close:()=>{S.custom=null;render();},
 closebg:(d,el,e)=>{ if(e.target===el){S.custom=null;render();} },
 top:(d,el)=>{const l=+d.l; S.custom.tops[d.t]=l; el.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.l===l))); refreshPrice();},
 cqty:d=>{S.custom.qty=Math.max(1,Math.min(20,S.custom.qty+ +d.d)); refreshPrice();},
 addpizza:()=>{const c=S.custom; S.cart.push({itemId:c.itemId,size:c.size,crust:c.crust,tops:{...c.tops},qty:c.qty,unit:unitPrice(c)}); S.custom=null;
   S.notice={kind:'ok',text:`Added ${c.qty}× ${byId(c.itemId).name} to your cart.`}; render();},
 addside:d=>{const ex=S.cart.find(l=>l.itemId===d.id); if(ex)ex.qty++; else S.cart.push({itemId:d.id,qty:1,unit:byId(d.id).price,tops:{}});
   S.notice={kind:'ok',text:`Added ${byId(d.id).name} to your cart.`}; render();},
 qty:d=>{const l=S.cart[+d.i]; l.qty+= +d.d; if(l.qty<1)S.cart.splice(+d.i,1); S.notice=null; render();},
 remove:d=>{S.cart.splice(+d.i,1); S.notice=null; render();},
 tofpay:()=>{S.errors={}; const f=S.fulfill;
   if(!f.mode){S.errors.mode='Choose pickup or delivery to continue.'; return render();}
   if(f.mode==='delivery'&&!f.useSaved){const form=$('#altform'); const d=Object.fromEntries(new FormData(form)); S.draft.alt=d; const e={}; validAddr(d,e); if(Object.keys(e).length){S.errors=e; return render();} f.alt={...d,state:d.state.toUpperCase()};}
   go('pay');},
 check:()=>{const o=S.order; const max=o.mode==='pickup'?3:4; if(o.stage<max&&Date.now()-o.stamps[o.stage].getTime()>4000)advance();
   S.checkMsg=`Checked at ${clockS(new Date())}. Status: ${STAGES[o.mode][o.stage][0]}.`; o.fresh=false; render();},
 skip:()=>{const o=S.order; if(o.mode==='pickup'&&o.stage>=3)return; advance(); S.checkMsg=null; render();},
 pickedup:()=>{advance(); S.checkMsg=null; render();},
 neworder:()=>{S.order=null; S.cart=[]; S.fulfill={mode:null,store:'west',time:'asap',useSaved:true,alt:{}}; S.draft.pay={}; clearInterval(ticker); go('menu'); S.notice={kind:'ok',text:'Welcome back. Start your next order below.'}; render();},
 logout:()=>{S.user=null;S.cart=[];S.order=null;S.fulfill={mode:null,store:'west',time:'asap',useSaved:true,alt:{}};S.draft={};clearInterval(ticker);go('welcome');}
};

const FORMS={
 signup:d=>{S.draft.signup=d; const e={};
   if(!d.name.trim())e.name='Enter your name.';
   if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email))e.email='Enter a valid email, like name@example.com.';
   else if(S.accounts.some(a=>a.email.toLowerCase()===d.email.toLowerCase()))e.email='An account with this email already exists. Log in instead.';
   if((d.password||'').length<8)e.password='Use at least 8 characters.';
   validAddr(d,e);
   S.errors=e; if(Object.keys(e).length){S.notice={kind:'bad',text:'Fix the highlighted fields to create your account.'};return render();}
   const acct={name:d.name.trim(),email:d.email.trim(),password:d.password,phone:d.phone,address:{street:d.street.trim(),apt:d.apt.trim(),city:d.city.trim(),state:d.state.toUpperCase(),zip:d.zip}};
   S.accounts.push(acct); S.user=acct; S.draft.signup={}; go('menu'); S.notice={kind:'ok',text:`Account created. Welcome, ${esc(acct.name)}. Pick something from the menu.`}; render();},
 login:d=>{S.draft.login={email:d.email}; const a=S.accounts.find(x=>x.email.toLowerCase()===d.email.trim().toLowerCase()&&x.password===d.password);
   if(!a){S.errors={password:'That email and password don\'t match an account.'}; return render();}
   S.user=a; go('menu'); S.notice={kind:'ok',text:`Welcome back, ${esc(a.name)}.`}; render();},
 alt:()=>A.tofpay(),
 pay:d=>{ if(S.paying)return; S.draft.pay={cname:d.cname,exp:d.exp,bzip:d.bzip}; const e={}; const num=d.cnum.replace(/\D/g,'');
   if(!d.cname.trim())e.cname='Enter the name on the card.';
   if(num.length<13||!luhn(num))e.cnum='Check the card number.';
   const m=/^(0[1-9]|1[0-2])\/(\d{2})$/.exec(d.exp); if(!m)e.exp='Use MM/YY.'; else if(new Date(2000+ +m[2],+m[1],1)<=new Date())e.exp='This card has expired.';
   if(!/^\d{3,4}$/.test(d.cvc))e.cvc='3 or 4 digits.';
   if(!/^\d{5}$/.test(d.bzip))e.bzip='5-digit ZIP.';
   S.errors=e; S.notice=null; if(Object.keys(e).length)return render();
   S.paying=true; render();
   setTimeout(()=>{S.paying=false;
     if(num==='4000000000000002'){S.notice={kind:'bad',text:'Your card was declined. Check the details or try a different card.'}; S.draft.pay.cnum=''; return render();}
     const f=S.fulfill, now=new Date(), mins=f.mode==='pickup'?(f.time==='asap'?20:Math.max(20,Math.round((+f.time-now)/60000))):40;
     S.order={id:'SL-'+String(Math.floor(1000+Math.random()*9000)),mode:f.mode,email:S.user.email,items:S.cart.map(l=>({...l})),total:subtotal()+fee(),last4:num.slice(-4),
       where:f.mode==='pickup'?storeLabel():addrLabel(deliveryAddr()),timeLabel:f.mode==='pickup'?timeLabel():'',eta:new Date(now.getTime()+mins*60000),stage:0,stamps:[now],fresh:true};
     S.cart=[]; S.draft.pay={}; startTicker(); go('status'); S.order.fresh=true; render();
   },900);}
};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]'); if(!el)return; const fn=A[el.dataset.act]; if(fn){ if(el.dataset.act!=='closebg'||e.target===el) fn(el.dataset,el,e);} });
document.addEventListener('submit',e=>{e.preventDefault(); const f=e.target; FORMS[f.dataset.form]?.(Object.fromEntries(new FormData(f)));});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.c){S.custom[t.dataset.c]=t.value; refreshPrice(); return;}
  if(t.dataset.f){const f=S.fulfill; if(t.dataset.f==='mode'){f.mode=t.value;S.errors={};} else if(t.dataset.f==='addr'){f.useSaved=t.value==='saved';} else f[t.dataset.f]=t.value; render();}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.fmt==='card'){t.value=t.value.replace(/\D/g,'').slice(0,16).replace(/(\d{4})(?=\d)/g,'$1 ');}
  if(t.dataset.fmt==='exp'){let v=t.value.replace(/\D/g,'').slice(0,4); if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2); t.value=v;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.custom){S.custom=null;render();}});
go(location.hash.replace(/^#\/?/,'')||'welcome',false);
</script>
</body>
